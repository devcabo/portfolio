# A cada envio para a main: testa, junta frontend + dados e publica no GitHub Pages.
# Montagem e publicação ficam em jobs separados: o deploy só começa depois que o pacote do site termina de subir.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testar
        run: node backend/testes/teste.mjs

      - name: Montar site
        run: |
          mkdir _site
          cp -r frontend/. _site/
          cp backend/dados/conteudo.json _site/conteudo.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
